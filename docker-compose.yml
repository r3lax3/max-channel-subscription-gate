services:
  postgres:
    image: postgres:16-alpine
    container_name: maxgate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxgate
      # Меняете пароль — поменяйте и database_url в .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxgate}
      POSTGRES_DB: maxgate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxgate -d maxgate"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: gatebot/Dockerfile
    container_name: maxgate
    restart: unless-stopped
    # Время на завершение: дождаться событий, принятых по webhook (до 25 с)
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Только для reverse proxy на этой же машине (nginx → 127.0.0.1:8081).
      # Внутри контейнера порт всегда 8080 — webhook_port в .env не меняйте.
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env

volumes:
  postgres_data:
