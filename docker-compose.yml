services:
  postgres:
    image: postgres:16-alpine
    container_name: maxgate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maxgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxgate}
      POSTGRES_DB: maxgate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxgate -d maxgate"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: gatebot/Dockerfile
    container_name: maxgate
    restart: unless-stopped
    # Время на завершение: дождаться событий, принятых по webhook (до 25 с)
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 8080 на VPS занят TG-ботом
      - "8081:8080"
    env_file:
      - .env

volumes:
  postgres_data:
